name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: bash ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MinePag-plugin
          path: build/libs/MinePag.jar
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a versão da tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $version do build.gradle.kts."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: MinePag-plugin

      - name: Criar a release com o asset MinePag.jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum MinePag.jar > MinePag.jar.sha256
          gh release create "$GITHUB_REF_NAME" MinePag.jar MinePag.jar.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "MinePag ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest
