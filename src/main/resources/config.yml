# Configuração do plugin MinePag.
# O token do servidor NÃO fica aqui: ele é salvo em plugins/MinePag/data/credentials.yml
# depois do /minepag pair. Você pode compartilhar este arquivo com o suporte sem expor a loja.

# Endereço da MinePag. Só altere com orientação do suporte. Precisa ser HTTPS
# (HTTP só é aceito para localhost, em desenvolvimento).
api-url: "https://api.minepag.com.br"

# Intervalo mínimo entre buscas de entregas, em segundos (5 a 300).
# A MinePag pode pedir intervalos maiores; o plugin nunca busca com mais frequência que isto.
poll-interval-seconds: 30

# Busca as entregas pendentes do jogador assim que ele entra no servidor.
check-on-join: true

delivery:
  # Comandos extras que o plugin nunca executa, mesmo que venham da loja.
  # A lista fixa da MinePag vale sempre e não precisa ser repetida aqui: op, deop, stop, restart, reload, rl,
  # whitelist, ban-ip, pardon-ip, save-off, transfer, sudo, esudo, plugman, minepag, mpag, lp editor,
  # luckperms editor, lp import e luckperms import.
  # Vale o comando raiz (com ou sem namespace, ex.: minecraft:op) ou um prefixo com argumentos (ex.: "lp editor").
  # Comandos dentro de "execute ... run" também são verificados.
  blocked-commands: []

announcements:
  # Anuncia as compras no chat do servidor.
  enabled: true
  # Intervalo mínimo entre dois anúncios, em segundos.
  min-interval-seconds: 10

# Idioma das mensagens: pt-BR ou en.
language: pt-BR

# Registra detalhes extras no console (o token nunca é registrado).
debug: false

# Mensagens em MiniMessage (https://docs.advntr.dev/minimessage/format).
# No Spigot, as cores básicas viram o formato legado e as demais tags são removidas.
